$schema: "http://json-schema.org/draft-07/schema#"
description: Data-agnostic pop-gen pipeline config schema. Validated at workflow start.
type: object
required: [cohort, reference, metadata, controls, qc, moi, structure, ibd, compute, paths]
additionalProperties: true

properties:

  cohort:
    type: object
    required: [name, input_type, vcf]
    additionalProperties: false
    properties:
      name:
        type: string
        minLength: 1
        description: Cohort label, used in output paths and report titles.
      input_type:
        type: string
        enum: [wgs, microhap]
        description: Selects which QC sub-rules file is included (qc_wgs.smk vs qc_microhap.smk).
      vcf:
        type: string
        minLength: 1
        description: Cohort VCF (bgzipped, indexed). Sample IDs must match metadata sample_id column.

  reference:
    type: object
    required: [fasta]
    additionalProperties: false
    properties:
      fasta:
        type: string
        description: Path to the indexed reference FASTA. <fasta>.fai must sit beside it.
      exclude_contigs:
        type: array
        items: { type: string }
        default: []
        description: Regex patterns; any .fai contig matching is dropped from the nuclear set.
      mask_regions:
        type: [string, "null"]
        default: null
        description: Optional bcftools -r region-string file (chrom:start-end). null disables masking.

  metadata:
    type: object
    required: [table, roles]
    additionalProperties: false
    properties:
      table:
        type: string
        description: Path to one tidy samples.tsv. The only metadata input the agnostic path consumes.
      gis:
        type: [string, "null"]
        description: |
          Optional per-sample GIS table (sample-ID + lat + long columns).
          When set, triggers gis_join + the province map. null = no map.
      roles:
        type: object
        required: [sample_id]
        additionalProperties: false
        description: Map analytical roles to actual column names in samples.tsv. Null disables the role.
        properties:
          sample_id:    { type: string, minLength: 1 }
          group:        { type: [string, "null"] }
          geography:    { type: [string, "null"] }
          country:      { type: [string, "null"] }
          host:         { type: [string, "null"] }
          date:         { type: [string, "null"] }
          case_control: { type: [string, "null"] }

  controls:
    type: object
    required: [exclude_patterns]
    additionalProperties: false
    properties:
      exclude_patterns:
        type: array
        items: { type: string }
        description: Regex patterns; sample IDs matching are dropped at the first QC step.

  qc:
    type: object
    required: [min_mac, filter_pass]
    additionalProperties: true
    properties:
      min_mac:     { type: integer, minimum: 0 }
      filter_pass: { type: boolean }

  moi:
    type: object
    required: [min_maf, fws_polyclonal_cutoff, fws_exclusion_cutoff, seed]
    additionalProperties: true
    properties:
      min_maf:
        type: number
        minimum: 0
        maximum: 1
        description: Stricter MAF for moimix (biallelic BAF needs it). V1 = 0.05.
      fws_polyclonal_cutoff:
        type: number
        minimum: 0
        maximum: 1
        description: Fws below = polyclonal (Manske 2012 convention). V1 = 0.95.
      fws_exclusion_cutoff:
        type: number
        minimum: 0
        maximum: 1
        description: Fws below = excluded from Stage 3+. V1 = 0.95.
      seed:
        type: integer
        description: moimix set.seed for reproducibility. V1 = 2023.

  structure:
    type: object
    required:
      - min_maf
      - max_sample_missing
      - max_variant_missing
      - admixture_k_min
      - admixture_k_max
      - admixture_cv_folds
      - cluster_labelling
    additionalProperties: true
    properties:
      min_maf:             { type: number,  minimum: 0, maximum: 1 }
      max_sample_missing:  { type: number,  minimum: 0, maximum: 1 }
      max_variant_missing: { type: number,  minimum: 0, maximum: 1 }
      admixture_k_min:     { type: integer, minimum: 1 }
      admixture_k_max:     { type: integer, minimum: 1 }
      admixture_cv_folds:  { type: integer, minimum: 2 }
      admixture_k:
        type: [integer, "null"]
        description: Override best-K. null = auto-pick from the CV minimum.
      cluster_labelling:
        type: string
        enum: [reference, auto, numbered]
        description: How to label ADMIXTURE components onto Cluster names.
      duplicate_id_pattern:
        type: [string, "null"]
        description: |
          Regex stripped off sample IDs to derive a dedup base ID (V1's
          Illumina lane suffix _DK.*). null = no strip (still dedups on the
          remaining underscore/hyphen normalisation).

  ibd:
    type: object
    required:
      - cluster_min_maf
      - clonal_ibd_threshold
      - min_cluster_n
    additionalProperties: true
    properties:
      cluster_min_maf:
        type: number
        minimum: 0
        maximum: 1
        description: PLINK --maf applied within each per-cluster IBD bfile.
      clonal_ibd_threshold:
        type: number
        minimum: 0
        maximum: 1
        description: Sample pairs at or above this fraction of sites IBD are called clonal.
      min_cluster_n:
        type: integer
        minimum: 2
        description: Skip per-cluster hmmIBD for any cluster below this sample count.
      focal_cluster:
        type: [string, "null"]
        description: |
          Optional: name of a single cluster to spotlight. When set, an
          additional pair-shaped clones file is emitted for that cluster
          (mirrors V1's Pen_clones_IBD.txt schema). null = combined table
          only.

  compute:
    type: object
    required: [threads_heavy, threads_light]
    additionalProperties: true
    properties:
      threads_heavy: { type: integer, minimum: 1 }
      threads_light: { type: integer, minimum: 1 }

  paths:
    type: object
    required: [outputs, logs, reports]
    additionalProperties: false
    properties:
      outputs: { type: string }
      logs:    { type: string }
      reports: { type: string }
