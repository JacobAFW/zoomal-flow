# Worked example: Indonesia + Malaysia P. knowlesi cohort.
# --------------------------------------------------------------------------
# This is the config the V1 pipeline ran against, expressed in the agnostic
# schema. Use it as a template for a real cohort: copy to config.yaml and
# adjust paths + role mappings. Data paths assume `agnostic/data/` either
# contains the cohort inputs directly OR is symlinked to the V1 `data/` tree
# (see agnostic/README.md).
# --------------------------------------------------------------------------

cohort:
  name: "indonesia_pk"
  input_type: "wgs"
  # Cleaned VCF: 990 → 981 samples (9 dropped via data/input_prep/droplist.txt).
  # See data/INPUT_PREP.md for the drop list and rationale.
  vcf: "data/vcf/merged_popgen.clean.vcf.gz"

reference:
  fasta: "data/reference/strain_A1_H.1.Icor.fasta"
  exclude_contigs: ["MIT", "API"]                # drops PKNH_MIT_v2 + new_API_strain_A1_H.1
  mask_regions: "data/reference/regions_to_mask.list"

metadata:
  # One tidy row per VCF sample: columns Sample, Country, State, District,
  # Cluster, Host, Parasitemia, EnrolDate, Source. The agnostic path consumes
  # it directly — no six-file assembly is re-done here.
  # This worked example ships a frozen copy of the Indo cohort table under
  # the agnostic tree's own data/metadata/ (gitignored — sample metadata is
  # under publication embargo, so it is never committed). For a fresh cohort
  # you drop your own tidy samples.tsv at the same relative path.
  table: "data/metadata/samples.tsv"
  roles:
    sample_id:    "Sample"
    group:        "Cluster"
    geography:    "State"
    country:      "Country"
    host:         "Host"
    date:         "EnrolDate"
    case_control: null
  # Per-sample lat/long (optional). Triggers the gis_join rule + map.
  # Schema: sample-ID col (Sample/sample/sample_id), plus lat & long cols
  # under any of (lat/Lat/Latitude, long/Long/Longitude).
  gis: "data/validation/admix_clusters_gis.tsv"

controls:
  exclude_patterns: ["ctrl", "cpos", "cneg"]

qc:
  min_mac: 2
  filter_pass: true

moi:
  min_maf: 0.05
  fws_polyclonal_cutoff: 0.95
  fws_exclusion_cutoff: 0.95
  seed: 2023

structure:
  min_maf: 0.01
  max_sample_missing: 0.10
  max_variant_missing: 0.10
  admixture_k_min: 2
  admixture_k_max: 10
  admixture_cv_folds: 5               # matches V1's --cv default
  admixture_k: null
  cluster_labelling: "reference"      # V1's Mn/Mf/Peninsular labels via the group role
  duplicate_id_pattern: "_DK.*"       # Illumina lane suffix on the Indo VCF

ibd:
  cluster_min_maf: 0.01
  clonal_ibd_threshold: 0.95
  min_cluster_n: 5
  focal_cluster: "Peninsular"         # slide-10 focus — extra pair-file to compare V1

introgression:
  window_size_bp: 10000
  min_snps_per_window: 5
  min_cluster_n: 5
  min_samples_per_window: 2
  per_cluster_min_pct: 0.05
  # K = 3 here (Mf / Mn / Peninsular) → 3 pairs, comfortably under the warning
  # threshold. Swap in an explicit list to focus, e.g. [["Peninsular", "Mf"]].
  pairs: "all"
  pair_warn_threshold: 15
  detection_rule: "absolute"          # V1's rule; see spec §2.3 for `relative`
  contour_level_other: 5.0e-4         # V1 find_introgression.R:241
  contour_level_own:   5.0e-4         # V1 find_introgression.R:257-259
  # Headline: windows introgressed uniquely in Aceh vs the rest of the cluster
  # its samples fall in (Peninsular). Generalises V1's Aceh-vs-Peninsular step.
  focal_group: "Aceh"
  # P. knowlesi hypervariable multigene families. SICAvar + KIR produce
  # false-positive introgression calls, so their windows are masked.
  gene_family_filters: ["SICA", "KIR"]
  gff: "data/reference/PlasmoDB_version/PlasmoDB-68_PknowlesiA1H1.gff"

selection:
  models:
    # V1's published iHS comparison — expected negative result (no candidate
    # regions). Filters reference canonical role columns:
    #   `group` = ADMIXTURE cluster label (Mn / Mf / Peninsular via
    #             cluster_labelling: reference)
    #   `geography` = province/state role
    - name: "Aceh_vs_other_Peninsular"
      case_filter:    "group == 'Peninsular' & geography == 'Aceh'"
      control_filter: "group == 'Peninsular' & geography != 'Aceh'"
  ihs_threshold:     4
  ihs_p_threshold:   0.0001
  window_size_bp:    10000
  window_overlap_bp: 1000
  min_extr_markers:  3

compute:
  threads_heavy: 8
  threads_light: 2

paths:
  outputs: "outputs"
  logs:    "logs"
  reports: "reports"
