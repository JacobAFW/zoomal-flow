# Data-agnostic pop-gen pipeline — config (TEMPLATE)
# --------------------------------------------------------------------------
# Copy this file (or cohort.example.yaml) to your cohort's working directory
# and fill in the values. Validated against config/schema/config.schema.yaml
# at workflow start; missing required fields or a bad input_type will abort
# the run with a clear message before any rule executes.
#
# Stages 0–1 (this increment) consume: cohort, reference, metadata, controls,
# qc, compute, paths. Later stage blocks (moi, structure, ibd, …) layer on top.
# --------------------------------------------------------------------------

cohort:
  name: "my_cohort"          # used in output paths / report title
  input_type: "wgs"          # "wgs" | "microhap"  — drives the QC seam
  vcf: "data/vcf/cohort.vcf.gz"   # bgzipped + indexed; sample IDs match metadata

reference:
  fasta: "data/reference/reference.fasta"   # .fai must sit beside it
  exclude_contigs: []        # regex patterns; matched against .fai contig names
  mask_regions: null         # path to bcftools -r region file, or null to skip mask

metadata:
  table: "data/metadata/samples.tsv"
  # Column-role map. Set to null to disable that role (the dependent
  # analyses will be skipped with a logged note, not error).
  roles:
    sample_id:    "sample_id"   # REQUIRED — must match VCF sample names
    group:        null
    geography:    null
    country:      null
    host:         null
    date:         null
    case_control: null

controls:
  exclude_patterns: ["ctrl", "cpos", "cneg"]   # regex, applied to sample IDs

qc:
  min_mac: 2
  filter_pass: true

moi:
  min_maf: 0.05                 # stricter MAF for moimix (biallelic BAF needs it)
  fws_polyclonal_cutoff: 0.95   # Fws below = polyclonal (Manske 2012 convention)
  fws_exclusion_cutoff: 0.95    # Fws below = excluded from Stage 3+ (single-genotype methods)
  seed: 2023                    # moimix set.seed; match across cohorts for reproducibility

structure:
  min_maf: 0.01                 # --maf for final variant filter (step 4 of V→S→V→M chain)
  max_sample_missing: 0.10      # --mind  (step 2)
  max_variant_missing: 0.10     # --geno  (step 3)
  admixture_k_min: 2
  admixture_k_max: 10
  admixture_cv_folds: 5         # ADMIXTURE --cv N folds; matches V1's default --cv (5-fold)
  # Fixed ADMIXTURE seed. Without it ADMIXTURE seeds itself and its CV error
  # moves between runs on identical input, which makes the automatic best-K
  # pick non-deterministic. Change it to check a result is not an artefact of
  # one initialisation; keep it fixed for a reproducible run.
  admixture_seed: 20260916
  # Threads per ADMIXTURE process. 1 on purpose: a fixed seed is not enough on
  # its own, because ADMIXTURE's threaded cross-validation accumulates in
  # thread-completion order, so at -j > 1 the CV error — and therefore the
  # auto-picked K — still moves between runs. See the schema for the numbers.
  admixture_threads: 1
  # Cohort size at or above which Stage 3 LD-prunes before ADMIXTURE. PLINK2
  # refuses --indep-pairwise below 50 samples, so below this the prune is
  # skipped, the unpruned bfile is used, and a prominent warning goes to the
  # log and to ld_prune_status.txt. 50 is PLINK2's own floor.
  min_samples_for_ld_prune: 50
  admixture_k: null             # null = auto-pick best K from CV minimum; int = override
  cluster_labelling: "numbered" # "numbered" (default, no metadata) | "auto" | "reference"
  duplicate_id_pattern: null    # regex stripped from sample IDs for dedup; null = no strip

ibd:
  cluster_min_maf: 0.01         # per-cluster PLINK --maf before hmmIBD
  clonal_ibd_threshold: 0.95    # fract_sites_IBD ≥ this = clonal pair
  min_cluster_n: 5              # skip hmmIBD on any cluster below this
  focal_cluster: null           # optional: emit an extra pair-shaped file for this cluster

# Clonality handling. Clonal samples are near-identical genotypes; counting
# each as independent evidence (pseudo-replication) biases every frequency- or
# count-based analysis. With `declonalize: true` the four frequency stages —
# structure, introgression, group summaries, selection — are each built TWICE:
#
#   outputs/<stage>/full/     every sample. The operational backbone; Stage 4
#                             clonal detection and the Stage-5 cluster
#                             definitions key off these and are NOT affected
#                             by anything below.
#   outputs/<stage>/unique/   one representative per clonal group + every
#                             sample in no group. A reporting/comparison arm.
#
# plus outputs/<stage>/declonalization_comparison.tsv putting the two side by
# side. Set to false to build only `full` (and skip the comparisons).
# Full rationale, the one-pass architecture, and how to read the comparison:
# docs/clonality.md.
clonality:
  declonalize: true
  # Representative rule (currently fixed, documented here so it is discoverable):
  # lowest per-sample missingness, ties broken alphabetically — the same rule
  # find_duplicates.R uses to pick between replicate pairs.

# Stage 5: introgression (pairwise density-cloud detection).
# See docs/introgression_analysis_spec.md for the method and its caveats.
# NOTE: `pairs: "all"` is C(K,2) comparisons, each a full density pass — the
# cost grows quadratically in K and every extra contrast is another
# multiple-comparison burden. The workflow warns above pair_warn_threshold.
introgression:
  window_size_bp: 10000         # window for the per-sample distance profile
  min_snps_per_window: 5        # strict >: a window needs at least 6 called SNPs
  min_cluster_n: 5              # clusters below this take no part in any pair
  min_samples_per_window: 2     # strict >: drop windows carried by ≤ 2 samples (V1's n > 2)
  # Per-cluster support filter. Since 2026-08-24 the shipped mechanism is an
  # ABSOLUTE floor, not a percentage: a percentage scales its threshold with
  # cluster n and so re-introduces the size confound Stage 5b traced (spec §9.4).
  # Threshold = max(ceiling(cluster_n * per_cluster_min_pct), per_cluster_min_samples).
  per_cluster_min_pct: 0        # 0 = floor only. Set > 0 for within-cluster framing.
  # DERIVE THIS FOR YOUR COHORT — do not inherit the number below. Run
  #   Rscript scripts/R/introgression_floor_derivation.R ... --out <...>
  # which permutes each sample's calls over its own eligible windows and reports
  # the smallest floor at which chance co-location stops producing windows.
  # The FDR-safe floor scales steeply with cluster size (Indo: Mf n=410 -> 32,
  # Mn n=108 -> 16, Peninsular n=35 -> 10), so there is no portable number.
  # The value here is the generic MINIMUM, not a derived one: it simply matches
  # the dataset-level filter (min_samples_per_window + 1), so the per-cluster
  # test is never weaker than the pooled one. See spec §9.5 before trusting it.
  per_cluster_min_samples: 3
  pairs: "all"                  # "all" (C(K,2)) | explicit [[Kx, Ky], …] list
  pair_warn_threshold: 15       # runtime warning above this many pairs
  detection_rule: "absolute"    # "absolute" (V1 default) | "relative" | "distance" (spec §2.3)
  contour_level_other: 5.0e-4   # density level for "inside the other cluster"  [absolute]
  contour_level_own:   5.0e-4   # density level for "inside its own cluster"    [absolute]
  # `distance` is the deterministic rule: it thresholds the raw per-window
  # distances and never fits a density surface, so its calls do not move when
  # cohort composition changes. See docs/introgression_analysis_spec.md.
  distance_margin: 15           # percentage points; d_own - d_other >= this   [distance, fixed]
  distance_adaptive: false      # true = derive the margin from within-cluster spread [distance]
  distance_adaptive_quantile: 0.9  # the quantile the adaptive mode calibrates on
  # -- focal subgroup ------------------------------------------------------
  # A subgroup INSIDE one cluster (a district, a host species, a time window),
  # tested for introgression ENRICHMENT against the rest of that cluster. This
  # is a separate test at a separate scale from the per-cluster floor above:
  # it has its own permutation null, sized to the subgroup, and its own BH/FDR
  # control. Nothing here affects `per_cluster_min_samples`, and vice versa.
  # See docs/introgression_analysis_spec.md §9.6.
  focal_group: null             # role value to test; null = skip the focal step
  focal_role: "geography"       # which canonical metadata role focal_group is a value of
  focal_fdr: 0.05               # BH-adjusted significance for a window to be called enriched
  focal_permutations: 1000      # label-permutation replicates for the focal null
  focal_seed: 20260828          # seed for that permutation, so runs are reproducible
  gene_family_filters: []       # attribute keywords masked from the GFF (e.g. hypervariable families)
  gff: null                     # optional annotation; gene-family filter skipped if unset

# Stage 6: selection scans (rehh iHS). Empty by default — add per-cohort
# models in cohort.example.yaml or your own cohort config. Each model has
#   name           - used for output directory
#   case_filter    - R expression over canonical roles + Cluster
#   control_filter - R expression over canonical roles + Cluster
# Example (uncomment to try):
#   models:
#     - name: "MyCase_vs_MyControl"
#       case_filter:    "group == 'Peninsular' & geography == 'Aceh'"
#       control_filter: "group == 'Peninsular' & geography != 'Aceh'"
selection:
  models: []
  ihs_threshold:     4          # candidate-region threshold on |iHS|
  ihs_p_threshold:   0.0001     # p-value threshold on candidate windows
  window_size_bp:    10000
  window_overlap_bp: 1000
  min_extr_markers:  3

compute:
  threads_heavy: 8
  threads_light: 2

paths:
  outputs: "outputs"
  logs:    "logs"
  reports: "reports"
