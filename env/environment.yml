# environment.yml — portable conda/mamba fallback for ZOOMAL-Flow.
#
# `pixi.toml` + `pixi.lock` in the repo root are the primary, *pinned* path:
# the lock file reproduces an exact solve, this file does not. Use this one
# when pixi is unavailable (an HPC module system that only offers conda, a
# site that mirrors conda channels, …) and accept that you get a fresh solve
# rather than the recorded one.
#
#   mamba env create -f env/environment.yml      # or: conda env create -f ...
#   conda activate zoomal-flow
#   bash env/postinstall.sh                      # the non-conda tools
#   snakemake --configfile config/config.yaml --cores 8
#
# The two differences from pixi.toml, both forced by what conda publishes:
#   * admixture / plink2 / bioconductor-seqarray have no osx-arm64 build. They
#     are listed here anyway because most conda users are on linux-64; on macOS
#     the solve will fail on them, so comment those three lines out and let
#     env/postinstall.sh supply them instead.
#   * moimix, rehh and rnaturalearthhires are not on any conda channel and are
#     never listed here — env/postinstall.sh installs them on every platform.
#
# See env/README.md for the version table and the full rationale.

name: zoomal-flow

channels:
  - conda-forge
  - bioconda

dependencies:
  # --- workflow engine + python -------------------------------------------
  - python=3.12
  - pip
  - snakemake=9.22
  - pyyaml>=6.0,<7
  - jsonschema>=4.0,<5
  - numpy>=2.0,<3
  - pytest>=8.0,<9

  # --- command-line tools --------------------------------------------------
  - bcftools=1.23
  - htslib=1.23
  - samtools=1.23
  - plink=1.90*
  - hmmibd=2.1*
  - quarto>=1.9,<2
  # linux-64 only — comment out on osx-arm64 (postinstall.sh supplies them)
  - admixture=1.3*
  - plink2

  # --- R -------------------------------------------------------------------
  - r-base=4.5
  - r-tidyverse=2.0*
  - r-data.table=1.17*
  - r-jsonlite>=2.0,<3
  - r-r.utils>=2.13,<3
  - r-viridis>=0.6.5,<0.7
  - r-viridislite>=0.4.3,<0.5
  - r-ggnewscale>=0.5.2,<0.6
  - r-ggbreak>=0.1.7,<0.2
  - r-svglite>=2.2,<3
  - r-ape>=5.8,<6
  - bioconductor-ggtree>=4.0,<5
  - r-sf>=1.1,<2
  - r-sp>=2.2,<3
  - r-rnaturalearth>=1.2,<2
  - r-rnaturalearthdata>=1.0,<2
  - r-igraph>=2.3,<3
  - r-quantreg>=6.1,<7
  - r-mgcv>=1.9,<2
  - r-biocmanager>=1.30,<2
  - r-remotes>=2.5,<3
  # linux-64 only — comment out on osx-arm64 (postinstall.sh supplies it)
  - bioconductor-seqarray>=1.50,<2
