# pixi.toml — ZOOMAL-Flow's own pinned environment.
#
# This manifest makes the workspace standalone: clone it, run `pixi install`, and
# every tool the pipeline invokes resolves without reference to the V1 vvg-box
# env (`../envs/activate.sh`). V1 stays on its own env; the two are independent.
#
#   pixi install          # conda-solvable stack, exactly as pinned in pixi.lock
#   pixi run setup        # the handful of tools conda cannot supply (see env/README.md)
#   pixi run snakemake --configfile config/config.yaml --cores 8
#
# The solved env lands in .pixi/ and is gitignored — only this file and
# pixi.lock are tracked. Version pins mirror what V1 actually ran with (see
# env/README.md for the full table and every deviation).

[workspace]
name = "zoomal-flow"
version = "0.1.0"
description = "Data-agnostic population-genetics pipeline for zoonotic malaria"
channels = ["conda-forge", "bioconda"]
platforms = ["osx-arm64", "linux-64"]

# ---------------------------------------------------------------------------
# Workflow engine + the Python the workflow code and tests import.
# ---------------------------------------------------------------------------
[dependencies]
python = "3.12.*"
pip = "*"
snakemake = "9.22.*"
pyyaml = ">=6.0,<7"          # workflow/Snakefile, scripts/py/validate_config.py
jsonschema = ">=4.0,<5"      # config-schema validation at DAG parse time
numpy = ">=2.0,<3"           # tests/tiny_cohort/generate.py
pytest = ">=8.0,<9"          # tests/

# ---------------------------------------------------------------------------
# Command-line tools the rules shell out to.
#   bcftools  — every VCF operation, Stages 0-6
#   htslib    — bgzip / tabix (indexing)
#   samtools  — faidx, for building the reference .fai (see examples/README)
#   plink     — Stage 3 LD prune / PCA / distance matrix (PLINK 1.9 semantics)
#   plink2    — Stage 1/3 filtering + frequency work            [see env/README.md]
#   admixture — Stage 3 ancestry proportions                    [see env/README.md]
#   hmmibd    — Stage 4 pairwise IBD                            [see env/README.md]
#   quarto    — the Stage 7 report
# ---------------------------------------------------------------------------
bcftools = "1.23.*"
htslib = "1.23.*"
samtools = "1.23.*"
plink = "1.90*"
hmmibd = "2.1.*"
quarto = ">=1.9,<2"

# ---------------------------------------------------------------------------
# R + every package the scripts in scripts/R/ actually load.
# Derived from the library()/requireNamespace()/pkg:: calls, not guessed.
# ---------------------------------------------------------------------------
r-base = "4.5.*"

# core data manipulation — loaded by nearly every script
r-tidyverse = "2.0.*"
"r-data.table" = "1.17.*"
r-jsonlite = ">=2.0,<3"       # validate_metadata.R
"r-r.utils" = ">=2.13,<3"     # run_rehh_ihs.R

# plotting stack
r-viridis = ">=0.6.5,<0.7"
r-viridislite = ">=0.4.3,<0.5"
r-ggnewscale = ">=0.5.2,<0.6" # plot_province_map.R (two colour scales on one map)
r-ggbreak = ">=0.1.7,<0.2"    # plot_clonal_temporal.R (axis break over date gaps)
r-svglite = ">=2.2,<3"        # ggsave(.svg) — every figure ships png + svg

# Stage 3 — phylogenetics and maps
r-ape = ">=5.8,<6"            # plot_nj_tree.R (NJ tree from the PLINK distance matrix)
bioconductor-ggtree = ">=4.0,<5"
r-sf = ">=1.1,<2"             # plot_province_map.R
r-sp = ">=2.2,<3"             # introgression_detect.R (point.in.polygon)
r-rnaturalearth = ">=1.2,<2"
r-rnaturalearthdata = ">=1.0,<2"

# Stage 4 — IBD networks
r-igraph = ">=2.3,<3"         # clonal_clusters.R, plot_ibd_connectivity.R

# Stage 2 — moimix attaches these at namespace-load time. Missing them is the
# failure V1's install.sh was patched for; they are pinned here from the start.
r-quantreg = ">=6.1,<7"
r-mgcv = ">=1.9,<2"

# Stage 7 report. Quarto drives R through knitr; both arrive transitively via
# the tidyverse/quarto stack, but the report depends on them directly, so they
# are pinned directly rather than left to chance on a future re-solve.
r-knitr = ">=1.50,<2"
r-rmarkdown = ">=2.30,<3"
r-yaml = ">=2.3,<3"

# bootstrappers for the four packages conda cannot supply (see env/postinstall.sh)
r-biocmanager = ">=1.30,<2"
r-remotes = ">=2.5,<3"

# ---------------------------------------------------------------------------
# moimix's dependency chain, taken from conda as pre-built binaries.
#
# moimix itself is a GitHub install, and it needs SeqVarTools, which needs
# logistf -> mice -> mitml -> jomo -> lme4 -> nloptr. Left to BiocManager these
# are SOURCE builds, and nloptr compiles NLopt with CMake: on a clean machine
# with no cmake the whole chain collapses and moimix never installs. That is a
# clean-clone-only failure — once the chain is on disk it never reappears — so
# it is pinned here rather than left to the postinstall to discover.
#
# Unversioned on purpose: these are incidental transitive dependencies, not
# tools whose version changes a result. pixi.lock records the exact solve.
# ---------------------------------------------------------------------------
r-nloptr = "*"
r-lme4 = "*"
r-jomo = "*"
r-mitml = "*"
r-mice = "*"
r-logistf = "*"
r-gwasexacthw = "*"           # SeqVarTools' other CRAN dependency

# Build tool for any R package that still compiles from source (nloptr/NLopt
# reach for it). Belt-and-suspenders: with the pins above nothing should need
# it, but its absence is what made the failure above so hard to read.
cmake = "*"

# ---------------------------------------------------------------------------
# Platform-specific. Three tools have no osx-arm64 conda build; on macOS they
# come from env/postinstall.sh instead (ADMIXTURE via Rosetta, PLINK2 as the
# upstream arm64 binary, SeqArray via BiocManager). On Linux conda has them all,
# so the postinstall step is nearly a no-op there.
# ---------------------------------------------------------------------------
[target.linux-64.dependencies]
admixture = "1.3.*"
plink2 = "*"
bioconductor-seqarray = ">=1.50,<2"
# SeqVarTools is noarch, but it requires bioconductor-seqarray, which bioconda
# builds for linux-64 only. So it can only be pinned here; on macOS both still
# come from BiocManager in env/postinstall.sh (their CRAN dependencies above
# are what make that path work without a compiler toolchain).
bioconductor-seqvartools = ">=1.48,<2"

# ---------------------------------------------------------------------------
# Tasks — the documented entry points.
# ---------------------------------------------------------------------------
[tasks]
setup = { cmd = "bash env/postinstall.sh", description = "Install the non-conda tools (see env/README.md)" }
check-env = { cmd = "bash env/check_env.sh", description = "Verify every pipeline tool + R package resolves" }
test = { cmd = "pytest tests -q", description = "Run the Python test suite" }
